vapfl_node:
  ros__parameters:
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: "/scan"
    odom_topic: "/odom"
    map_topic: "/map"
    initial_pose_topic: "/initialpose"
    publish_tf: true
    transform_tolerance: 0.1
    initial_particles: 300

    # Motion model noise parameters
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.10
    alpha4: 0.05

    # Sensor model probabilistic weights & decimation
    z_hit: 0.80
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.10
    sigma_hit: 0.20
    lambda_short: 0.50
    beam_step: 6
    max_beams: 60

    # Variance-based adaptive sampler & kidnap recovery
    min_particles: 100
    max_particles: 800
    target_variance: 0.02
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.10
    doping_count: 15
    doping_threshold: 0.05

    # DBSCAN spatial clustering
    dbscan_eps: 0.30
    dbscan_eps_theta: 0.50
    dbscan_min_pts: 5

    # Filter motion trigger thresholds
    update_min_d: 0.05
    update_min_a: 0.05
